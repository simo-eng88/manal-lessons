<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>أين نضعها في الخطة؟</title>
<style>
@font-face{font-family:Cairo;src:url('Cairo-Bold.ttf');font-weight:700}
:root{--p:#1E5F74;--s:#A55421;--soft:#EAF6F4;--ok:#25724F;--okbg:#E6F2E9;--bad:#B3261E;--badbg:#F8E9EC}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:Cairo,Tahoma,sans-serif;font-weight:700;color:#2E2A2B;
 background:#FFFBF7;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:var(--p);color:#fff;text-align:center;padding:14px 16px}
header h1{margin:0;font-size:clamp(22px,3.4vw,38px)}
header p{margin:4px 0 0;font-size:clamp(14px,1.8vw,20px);opacity:.9}
main{width:min(1100px,94vw);flex:1;padding:22px 0}
.bar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.stars{font-size:clamp(20px,2.6vw,30px);letter-spacing:4px;color:#E0A100}
.count{background:var(--soft);color:var(--s);border-radius:99px;padding:6px 16px;font-size:18px}
.card{background:#fff;border:2px solid #E4D7DC;border-radius:24px;padding:22px}
.q{font-size:clamp(22px,3vw,36px);color:var(--p);text-align:center;margin:4px 0 18px;line-height:1.5}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media(max-width:640px){.opts{grid-template-columns:1fr}}
button.opt{display:flex;align-items:center;gap:14px;width:100%;min-height:84px;padding:10px 14px;border-radius:18px;
 border:2px solid #DBCBD1;background:#fff;font:inherit;font-size:clamp(18px,2.3vw,28px);color:#2E2A2B;cursor:pointer;text-align:right}
button.opt:hover{border-color:var(--s)}
.badge{flex:0 0 58px;height:58px;border-radius:14px;color:#fff;display:grid;place-items:center;font-size:32px}
button.opt.right{background:var(--okbg);border-color:var(--ok)}
button.opt.right .badge{background:var(--ok)!important}
button.opt:disabled{cursor:default}
.msg{min-height:64px;margin-top:16px;border-radius:16px;padding:12px 16px;font-size:clamp(17px,2vw,24px);text-align:center;visibility:hidden}
.msg.show{visibility:visible}
.msg.ok{background:var(--okbg);color:var(--ok);border:2px solid #97C9A7}
.msg.bad{background:var(--badbg);color:var(--bad);border:2px solid var(--p)}
.actions{display:flex;justify-content:center;margin-top:16px}
.btn{border:0;border-radius:99px;padding:12px 30px;font:inherit;font-size:22px;background:var(--p);color:#fff;cursor:pointer}
.btn[hidden]{display:none}
.end{text-align:center;padding:30px 10px}
.end h2{font-size:clamp(28px,4vw,48px);color:var(--p);margin:0 0 10px}
footer{width:100%;text-align:center;color:var(--p);font-size:15px;padding:12px;border-top:1px solid #E4D7DC;background:#fff}
</style>
</head>
<body>
<header><h1>أين نضعها في الخطة؟</h1><p>كيف أخطّط لاستقصاء عن تأثير التمارين الرياضية في معدّل ضربات قلبي؟</p></header>
<main>
<div class="bar"><span class="count" id="count"></span><span class="stars" id="stars"></span></div>
<div class="card" id="play">
<div class="q" id="q"></div>
<div class="opts" id="opts"></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="actions"><button class="btn" id="next" hidden>السؤال التالي ←</button></div>
</div>
<div class="card end" id="end" hidden>
<h2>أحسنتِ يا بطلة! 🌟</h2>
<p id="score" style="font-size:26px"></p>
<div class="actions"><button class="btn" id="again">العبي مرة أخرى</button></div>
</div>
</main>
<footer>(إعداد الأستاذة/ منال شبانة - معلمة علوم - مدرسة الثمامة الابتدائية للبنات)</footer>
<script>
const QS = [{"question": "أين نضع الإصبعين لنشعر بالنبض؟", "options": ["على الركبة", "على الكتف", "على المعصم", "على الجبهة"], "correct": 2, "reason": "نعدّ النبض عند المعصم أو الرقبة."}, {"question": "أي إصبعين نستخدم لأخذ النبض؟", "options": ["السبابة والوسطى", "الإبهام والخنصر", "الإبهام والسبابة", "البنصر والخنصر"], "correct": 0, "reason": "نضع إصبعَي السبابة والوسطى على المعصم لنشعر بالنبض."}, {"question": "معدّل ضربات القلب هو عدد الضربات في:", "options": ["ثانية واحدة", "دقيقة واحدة", "ساعة واحدة", "يوم واحد"], "correct": 1, "reason": "معدّل ضربات القلب هو عدد ضربات القلب في دقيقة واحدة."}, {"question": "أين نسمع القلب بالسماعة؟", "options": ["أعلى الظهر", "منتصف البطن", "الجانب الأيمن للرقبة", "الجانب الأيسر من الصدر"], "correct": 3, "reason": "القلب في الصدر بين الرئتين ويميل إلى اليسار، فنسمعه يسار الصدر."}, {"question": "ما النبض؟", "options": ["صوت الهواء في الرئتين", "حركة منتظمة للدم في الجسم", "عدد مرات التنفّس", "حركة العضلات عند الجري"], "correct": 1, "reason": "النبض حركة منتظمة للدم في أثناء ضخّ القلب له في الجسم."}, {"question": "لماذا نقيس معدّل ضربات القلب من المعصم؟", "options": ["لأن القلب يقع في المعصم", "لأن المعصم أسرع من القلب", "لأن السماعة لا تعمل", "لأن معدّل النبض يساوي معدّله"], "correct": 3, "reason": "عدد النبضات في دقيقة يساوي معدّل ضربات القلب."}, {"question": "أي مما يأتي تمرين خفيف؟", "options": ["المشي", "الجري", "القفز", "السباحة"], "correct": 0, "reason": "المشي تمرين خفيف، أمّا الجري والقفز والسباحة فتمارين مجهدة."}, {"question": "ما المتغيّر التابع في استقصائنا؟", "options": ["نوع التمرين", "مدّة التمرين", "معدّل ضربات القلب", "نوع الحذاء"], "correct": 2, "reason": "المتغيّر التابع هو ما نقيسه: معدّل ضربات القلب."}];
const COLORS = ["#82183D", "#1E6455", "#A55421", "#695184"], LETTERS = ["أ", "ب", "ج", "د"];
let i = 0, stars = 0, tries = 0, timer = null;
const $ = id => document.getElementById(id);
function render() {
  const q = QS[i]; tries = 0;
  $('count').textContent = 'السؤال ' + (i + 1) + ' من ' + QS.length;
  $('stars').textContent = '★'.repeat(stars) + '☆'.repeat(QS.length - stars);
  $('q').textContent = q.question;
  $('msg').className = 'msg'; $('next').hidden = true;
  const box = $('opts'); box.innerHTML = '';
  q.options.forEach((o, k) => {
    const b = document.createElement('button'); b.className = 'opt'; b.type = 'button';
    const badge = document.createElement('span'); badge.className = 'badge'; badge.style.background = COLORS[k]; badge.textContent = LETTERS[k];
    const t = document.createElement('span'); t.textContent = o;
    b.append(badge, t); b.onclick = () => pick(k, b); box.append(b);
  });
}
function pick(k, b) {
  const q = QS[i], m = $('msg'); clearTimeout(timer);
  if (k === q.correct) {
    if (tries === 0) stars++;
    $('stars').textContent = '★'.repeat(stars) + '☆'.repeat(QS.length - stars);
    b.classList.add('right'); document.querySelectorAll('button.opt').forEach(x => x.disabled = true);
    m.textContent = 'أحسنتِ! ' + q.reason; m.className = 'msg show ok'; $('next').hidden = false;
  } else {
    tries++; m.textContent = 'حاولي مرة أخرى، فكّري جيدًا.'; m.className = 'msg show bad';
    timer = setTimeout(() => { m.className = 'msg'; }, 2500);
  }
}
$('next').onclick = () => { i++; if (i < QS.length) render(); else finish(); };
function finish() { $('play').hidden = true; $('end').hidden = false; $('score').textContent = 'جمعتِ ' + stars + ' من ' + QS.length + ' نجوم'; }
$('again').onclick = () => { i = 0; stars = 0; $('end').hidden = true; $('play').hidden = false; render(); };
render();
</script>
</body>
</html>
